<title>Solune Dev Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0B0D12;
    --surface: #12151D;
    --surfaceElevated: #191E28;
    --border: #272D39;
    --textPrimary: #F3F5F8;
    --textSecondary: #929AAA;
    --accent: #8B83F6;
    --secondary: #66D9C3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--textPrimary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: var(--surfaceElevated);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--textSecondary);
    font-size: 13px;
    margin: 0 0 24px;
  }
  #qr {
    display: flex;
    justify-content: center;
    padding: 16px;
    background: #ffffff;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  .url {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--secondary);
    word-break: break-all;
    margin-bottom: 20px;
  }
  .steps {
    text-align: left;
    font-size: 13px;
    color: var(--textSecondary);
    line-height: 1.6;
    padding-left: 18px;
    margin: 0;
  }
  .steps li { margin-bottom: 4px; }
  .steps b { color: var(--textPrimary); }
</style>

<div class="card">
  <h1>Scan to open Solune</h1>
  <p class="sub">Expo Go dev connection</p>
  <div id="qr"></div>
  <div class="url" id="url-text">exp://192.168.1.29:8081</div>
  <ol class="steps">
    <li>Make sure your phone is on the <b>same Wi-Fi</b> as this computer.</li>
    <li>Open <b>Expo Go</b> and tap <b>Scan QR Code</b>.</li>
    <li>If it was open from a previous session, close it fully and rescan rather than reopening from history.</li>
  </ol>
</div>

<script>
  var url = "exp://192.168.1.29:8081";
  document.getElementById('url-text').textContent = url;
  new QRCode(document.getElementById('qr'), {
    text: url,
    width: 200,
    height: 200,
    colorDark: "#0B0D12",
    colorLight: "#ffffff",
  });
</script>
